name: Keep Supabase Awake

# Supabase free-tier projects auto-pause after 7 days with zero API
# activity. This workflow makes one lightweight read every few days so
# the project is always live for the department, without needing the
# Pro plan.

on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC — safely inside the 7-day window
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/departments?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::warning::Supabase ping returned $status — check the project isn't paused or the secrets aren't stale."
          fi