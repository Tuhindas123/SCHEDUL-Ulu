<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow-Tracker | Smart Student Assistant</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Persistent active tab selection
            const [activeTab, setActiveTab] = useState(() => {
                return localStorage.getItem('ft_active_tab') || 'dashboard';
            });

            // Schedule starts completely EMPTY for new users
            const [schedule, setSchedule] = useState(() => {
                const saved = localStorage.getItem('ft_schedule');
                return saved ? JSON.parse(saved) : [];
            });

            // Student profile settings
            const [studentProfile, setStudentProfile] = useState(() => {
                const saved = localStorage.getItem('ft_profile');
                return saved ? JSON.parse(saved) : { course: 'MBA', semester: '3rd Sem', specialization: 'Finance' };
            });

            // Personal custom tasks start empty
            const [customTasks, setCustomTasks] = useState(() => {
                const saved = localStorage.getItem('ft_tasks');
                return saved ? JSON.parse(saved) : [];
            });

            const [filter, setFilter] = useState('');
            const [newTask, setNewTask] = useState({ title: '', time: '', day: 'Monday' });

            // Persist changes in localStorage
            useEffect(() => {
                localStorage.setItem('ft_active_tab', activeTab);
            }, [activeTab]);

            useEffect(() => {
                localStorage.setItem('ft_schedule', JSON.stringify(schedule));
            }, [schedule]);

            useEffect(() => {
                localStorage.setItem('ft_profile', JSON.stringify(studentProfile));
            }, [studentProfile]);

            useEffect(() => {
                localStorage.setItem('ft_tasks', JSON.stringify(customTasks));
            }, [customTasks]);

            // Excel Parsing logic
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const data = XLSX.utils.sheet_to_json(ws);
                    setSchedule(data);
                };
                reader.readAsBinaryString(file);
            };

            // Detect overlapping class times
            const findConflicts = () => {
                const conflicts = [];
                for (let i = 0; i < schedule.length; i++) {
                    for (let j = i + 1; j < schedule.length; j++) {
                        if (schedule[i].Day && schedule[i].Time && schedule[i].Day === schedule[j].Day && schedule[i].Time === schedule[j].Time) {
                            conflicts.push([schedule[i], schedule[j]]);
                        }
                    }
                }
                return conflicts;
            };

            const conflicts = findConflicts();

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTask.title || !newTask.time) return;
                setCustomTasks([...customTasks, { ...newTask, id: Date.now() }]);
                setNewTask({ title: '', time: '', day: 'Monday' });
            };

            const handleClearData = () => {
                if (confirm("Are you sure you want to clear your uploaded timetable and reset the application?")) {
                    localStorage.clear();
                    setActiveTab('dashboard');
                    setSchedule([]);
                    setCustomTasks([]);
                    setStudentProfile({ course: 'MBA', semester: '3rd Sem', specialization: 'Finance' });
                }
            };

            const filteredSchedule = schedule.filter(item => 
                filter === '' || Object.values(item).some(val => String(val).toLowerCase().includes(filter.toLowerCase()))
            );

            return (
                <div class="flex flex-col min-h-screen">
                    {/* Header */}
                    <header class="bg-indigo-700 text-white shadow-lg">
                        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="flex items-center gap-3">
                                <div class="bg-white text-indigo-700 font-black p-2 rounded-lg text-xl">FT</div>
                                <div>
                                    <h1 class="text-2xl font-bold tracking-wide">Flow-Tracker</h1>
                                    <p class="text-xs text-indigo-200">Smart Student Productivity Assistant</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="bg-indigo-800/60 px-4 py-2 rounded-lg border border-indigo-500/30 text-sm">
                                    🎓 <strong>{studentProfile.course}</strong> - {studentProfile.semester} ({studentProfile.specialization})
                                </div>
                                {schedule.length > 0 && (
                                    <button 
                                        onClick={handleClearData}
                                        class="text-xs bg-red-600 hover:bg-red-700 px-3 py-2 rounded text-white font-semibold transition">
                                        🗑️ Clear Data
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-10">
                        <div class="max-w-7xl mx-auto px-6 flex gap-8">
                            <button 
                                onClick={() => setActiveTab('dashboard')} 
                                class={`py-4 font-semibold text-sm border-b-2 transition ${activeTab === 'dashboard' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                                📊 Home Dashboard
                            </button>
                            <button 
                                onClick={() => setActiveTab('schedule')} 
                                class={`py-4 font-semibold text-sm border-b-2 transition ${activeTab === 'schedule' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                                📅 Timetable View
                            </button>
                            <button 
                                onClick={() => setActiveTab('conflicts')} 
                                class={`py-4 font-semibold text-sm border-b-2 transition relative ${activeTab === 'conflicts' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                                ⚠️ Class Clashes
                                {conflicts.length > 0 && (
                                    <span class="ml-2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">{conflicts.length}</span>
                                )}
                            </button>
                            <button 
                                onClick={() => setActiveTab('tasks')} 
                                class={`py-4 font-semibold text-sm border-b-2 transition ${activeTab === 'tasks' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                                📝 Personal Tasks
                            </button>
                        </div>
                    </nav>

                    {/* Main Workspace */}
                    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full">

                        {/* HOME DASHBOARD TAB */}
                        {activeTab === 'dashboard' && (
                            <div class="space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-xs font-bold text-gray-400 uppercase">Up Next Today</p>
                                        <p class="text-lg font-bold text-gray-800 mt-1">
                                            {schedule.length > 0 ? (schedule[0].Subject || 'No Title') : 'No Classes Loaded'}
                                        </p>
                                        <p class="text-xs text-indigo-600 mt-1">
                                            {schedule.length > 0 ? `⏰ ${schedule[0].Time || 'TBD'} • ${schedule[0].Room || 'N/A'}` : 'Upload timetable to view'}
                                        </p>
                                    </div>
                                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-xs font-bold text-gray-400 uppercase">Classes Loaded</p>
                                        <p class={`text-lg font-bold mt-1 ${schedule.length > 0 ? 'text-green-600' : 'text-gray-400'}`}>
                                            {schedule.length} Sessions
                                        </p>
                                        <p class="text-xs text-gray-500 mt-1">{schedule.length > 0 ? 'Parsed from Excel' : 'Waiting for file'}</p>
                                    </div>
                                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-xs font-bold text-gray-400 uppercase">Schedule Conflicts</p>
                                        <p class={`text-lg font-bold mt-1 ${conflicts.length > 0 ? 'text-red-600' : 'text-green-600'}`}>
                                            {conflicts.length} Overlaps
                                        </p>
                                        <p class="text-xs text-gray-500 mt-1">Class clashes detected</p>
                                    </div>
                                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p class="text-xs font-bold text-gray-400 uppercase">Personal Tasks</p>
                                        <p class="text-lg font-bold text-indigo-600 mt-1">{customTasks.length} Pending</p>
                                        <p class="text-xs text-gray-500 mt-1">Personal study & tasks</p>
                                    </div>
                                </div>

                                {/* Main File Upload Area */}
                                <div class="bg-gradient-to-r from-indigo-50 to-blue-50 border-2 border-dashed border-indigo-200 rounded-2xl p-8 text-center flex flex-col items-center justify-center">
                                    <div class="bg-indigo-600 text-white p-4 rounded-full mb-3 text-2xl shadow-md">📁</div>
                                    <h3 class="font-bold text-indigo-950 text-xl mb-1">Upload Your University Timetable</h3>
                                    <p class="text-xs text-indigo-700 max-w-md mb-6">Select your university .xlsx or .xls file. Flow-Tracker will automatically parse and plot your classes.</p>
                                    <input 
                                        type="file" 
                                        accept=".xls,.xlsx" 
                                        onChange={handleFileUpload}
                                        class="text-sm text-gray-500 file:mr-0 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer shadow-sm"
                                    />
                                </div>

                                {/* Class Quick Preview */}
                                {schedule.length > 0 && (
                                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                        <h3 class="font-bold text-gray-800 mb-4">Loaded Classes Overview</h3>
                                        <div class="space-y-3">
                                            {schedule.slice(0, 4).map((item, idx) => (
                                                <div key={idx} class="p-4 rounded-lg bg-gray-50 border border-gray-100 flex justify-between items-center">
                                                    <div>
                                                        <p class="font-bold text-gray-800">{item.Subject || 'Unnamed Subject'}</p>
                                                        <p class="text-xs text-gray-500">👨‍🏫 {item.Faculty || 'Staff'} • 📍 {item.Room || 'N/A'}</p>
                                                    </div>
                                                    <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">{item.Time || 'TBD'}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TIMETABLE TAB */}
                        {activeTab === 'schedule' && (
                            <div class="space-y-6">
                                {schedule.length > 0 ? (
                                    <>
                                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between gap-4">
                                            <input 
                                                type="text" 
                                                placeholder="🔍 Search subject, professor, or room..." 
                                                value={filter} 
                                                onChange={(e) => setFilter(e.target.value)}
                                                class="p-2.5 border border-gray-300 rounded-lg w-full md:w-1/3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                            />
                                            <div class="flex items-center gap-2">
                                                <span class="text-xs text-gray-500">Filter Specialization:</span>
                                                <select 
                                                    value={studentProfile.specialization} 
                                                    onChange={(e) => setStudentProfile({...studentProfile, specialization: e.target.value})}
                                                    class="p-2 border border-gray-300 rounded-lg text-sm bg-white">
                                                    <option value="Finance">Finance</option>
                                                    <option value="Marketing">Marketing</option>
                                                    <option value="All">All Electives</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {filteredSchedule.map((item, idx) => {
                                                const isFloating = String(item.Subject).includes("Floating") || item.Type === "Floating";
                                                const isMentor = String(item.Subject).includes("Mentor") || item.Type === "Mentor";
                                                return (
                                                    <div key={idx} class={`p-5 rounded-xl border transition shadow-sm hover:shadow-md ${
                                                        isFloating ? 'bg-amber-50 border-amber-200' : 
                                                        isMentor ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-gray-200'
                                                    }`}>
                                                        <div class="flex justify-between items-start mb-2">
                                                            <span class="text-xs font-bold uppercase tracking-wide text-gray-400">{item.Day || 'Scheduled Day'}</span>
                                                            {isFloating && <span class="bg-amber-200 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded">Flexible Slot</span>}
                                                            {isMentor && <span class="bg-emerald-200 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded">1-on-1 Meeting</span>}
                                                        </div>
                                                        <h4 class="font-bold text-gray-800 text-base mb-1">{item.Subject || 'Subject'}</h4>
                                                        <p class="text-xs text-gray-600">📍 {item.Room || 'Unassigned'} | 👨‍🏫 {item.Faculty || 'Staff'}</p>
                                                        <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
                                                            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">⏰ {item.Time || 'TBD'}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </>
                                ) : (
                                    <div class="bg-white p-12 text-center rounded-xl border border-dashed border-gray-300">
                                        <p class="text-gray-500 font-medium mb-2">Your timetable is empty.</p>
                                        <p class="text-xs text-gray-400">Please switch to the <strong>Home Dashboard</strong> tab and upload an Excel schedule file.</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* CLASH ALERTS TAB */}
                        {activeTab === 'conflicts' && (
                            <div class="space-y-6">
                                <div class="bg-red-50 border border-red-200 rounded-xl p-6">
                                    <h3 class="text-lg font-bold text-red-800 mb-1">Clash & Overlap Warnings</h3>
                                    <p class="text-xs text-red-600">The system flags electives scheduled at the same day and time.</p>
                                </div>

                                {conflicts.length > 0 ? (
                                    <div class="space-y-4">
                                        {conflicts.map(([c1, c2], idx) => (
                                            <div key={idx} class="bg-white border-l-4 border-red-500 rounded-xl p-6 shadow-sm border border-gray-200">
                                                <p class="text-xs font-bold text-red-600 uppercase mb-3">⚠️ Conflict: {c1.Day} @ {c1.Time}</p>
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                                        <span class="text-xs font-semibold text-gray-500">Class A</span>
                                                        <h4 class="font-bold text-gray-800">{c1.Subject}</h4>
                                                        <p class="text-xs text-gray-600">Room: {c1.Room || 'N/A'} | Faculty: {c1.Faculty || 'N/A'}</p>
                                                    </div>
                                                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                                        <span class="text-xs font-semibold text-gray-500">Class B</span>
                                                        <h4 class="font-bold text-gray-800">{c2.Subject}</h4>
                                                        <p class="text-xs text-gray-600">Room: {c2.Room || 'N/A'} | Faculty: {c2.Faculty || 'N/A'}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div class="bg-white p-12 text-center rounded-xl border border-gray-200">
                                        <p class="text-gray-500 font-bold text-lg">No Class Clashes Detected</p>
                                        <p class="text-xs text-gray-400 mt-1">Upload a schedule file or add classes to run clash detection.</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* PERSONAL TASKS TAB */}
                        {activeTab === 'tasks' && (
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                                    <h3 class="font-bold text-gray-800 mb-4">Add Custom Event / Task</h3>
                                    <form onSubmit={handleAddTask} class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-bold text-gray-600 mb-1">Task Title</label>
                                            <input 
                                                type="text" 
                                                placeholder="e.g. Study, Gym, Group Meeting"
                                                value={newTask.title} 
                                                onChange={(e) => setNewTask({...newTask, title: e.target.value})}
                                                class="w-full p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-gray-600 mb-1">Day</label>
                                            <select 
                                                value={newTask.day} 
                                                onChange={(e) => setNewTask({...newTask, day: e.target.value})}
                                                class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-white">
                                                <option value="Monday">Monday</option>
                                                <option value="Tuesday">Tuesday</option>
                                                <option value="Wednesday">Wednesday</option>
                                                <option value="Thursday">Thursday</option>
                                                <option value="Friday">Friday</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold text-gray-600 mb-1">Time</label>
                                            <input 
                                                type="text" 
                                                placeholder="e.g. 04:00 PM" 
                                                value={newTask.time} 
                                                onChange={(e) => setNewTask({...newTask, time: e.target.value})}
                                                class="w-full p-2.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-indigo-700 transition">
                                            + Add Task
                                        </button>
                                    </form>
                                </div>

                                <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                    <h3 class="font-bold text-gray-800 mb-4">Integrated Personal Tasks</h3>
                                    {customTasks.length > 0 ? (
                                        <div class="space-y-3">
                                            {customTasks.map((task) => (
                                                <div key={task.id} class="p-4 rounded-lg bg-indigo-50/50 border border-indigo-100 flex justify-between items-center">
                                                    <div>
                                                        <p class="font-bold text-gray-800">{task.title}</p>
                                                        <p class="text-xs text-indigo-600 font-medium">{task.day} • {task.time}</p>
                                                    </div>
                                                    <button 
                                                        onClick={() => setCustomTasks(customTasks.filter(t => t.id !== task.id))}
                                                        class="text-xs text-red-500 hover:text-red-700 font-semibold">
                                                        Remove
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div class="text-center py-8 text-gray-400 text-xs border border-dashed rounded-lg">
                                            No custom tasks added yet.
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
